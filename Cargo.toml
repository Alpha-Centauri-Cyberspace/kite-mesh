[workspace]
resolver = "2"
members = [
    "crates/kite-mesh-proto",
    "crates/kite-mesh-core",
    "crates/kite-mesh-transport",
    "crates/kite-mesh-discovery",
    "crates/kited",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Alpha-Centauri-Cyberspace/kite-mesh"

[workspace.dependencies]
# Internal crates
kite-mesh-proto = { path = "crates/kite-mesh-proto" }
kite-mesh-core = { path = "crates/kite-mesh-core" }
kite-mesh-transport = { path = "crates/kite-mesh-transport" }
kite-mesh-discovery = { path = "crates/kite-mesh-discovery" }

# Networking
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "kad",
    "mdns",
    "identify",
    "request-response",
    "macros",
    "ed25519",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
prost-build = "0.13"
bytes = "1"

# Crypto / hashing
blake3 = "1"

# Embeddings
fastembed = "4"

# Persistence
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "uuid",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# Error handling
anyhow = "1"
thiserror = "2"

# Time / ids
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Config
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# Test utilities
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The walking skeleton intentionally uses unwrap/expect in tests and build-
# scripts. Re-tighten these in Phase 1 when the public surface stabilizes.
