syntax = "proto3";

package kite.mesh.v1;

// Full task request carried inside an AclMessage(REQUEST). See MESH_PRD.md §5.
message Intent {
  string intent_id = 1;
  string requester_agent_id = 2;
  string description = 3;
  bytes payload = 4;
  uint64 deadline_ns = 5;
}

message Proposal {
  string capability_id = 1;
  string provider_agent_id = 2;
  string quote = 3;
  uint64 expires_at_ns = 4;
}

message Agreement {
  string conversation_id = 1;
  string capability_id = 2;
}

// Renamed from `Result` to avoid shadowing Rust's built-in Result alias.
message TaskResult {
  string conversation_id = 1;
  bytes payload = 2;
  ResultStatus status = 3;
  string error_message = 4;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_OK = 1;
  RESULT_STATUS_FAILURE = 2;
  RESULT_STATUS_CANCELED = 3;
}

// Schema slot for streaming execution frames. Phase 1+.
message StreamFrame {
  string conversation_id = 1;
  bytes payload = 2;
  bool is_final = 3;
}

message Receipt {
  string conversation_id = 1;
  string capability_id = 2;
  string requester_peer_id = 3;
  string provider_peer_id = 4;
  ResultStatus status = 5;
  uint64 completed_at_ns = 6;
  bytes signature = 7;
  bytes issuer_public_key = 8;
}
